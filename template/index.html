<!DOCTYPE html>
<html data-theme="light" data-lang="zh">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>No More AI FOMO — Archive</title>
  <style>
    :root,
    [data-theme="light"] {
      --bg: #f5f2ea; --bg-image: none;
      --surface: #fbf9f4;
      --hairline: #d9d2c2; --hairline-soft: #e6e0d2;
      --text: #17140e; --text-secondary: #4a4438; --text-muted: #8a8272;
      --accent-hover: #6a4fe0;
      --chip-bg: #2e6b4f; --chip-fg: #f5f2ea;
      --font-sans: -apple-system, BlinkMacSystemFont, "PingFang TC", "Noto Sans TC", "Segoe UI", Roboto, sans-serif;
      --font-mono: "SF Mono", ui-monospace, Menlo, "Cascadia Code", monospace;
    }
    [data-theme="dark"] {
      --bg: #0c0930;
      --bg-image:
        radial-gradient(120% 95% at 82% 8%, rgba(96,74,236,0.50), transparent 55%),
        radial-gradient(110% 85% at 12% 88%, rgba(64,44,178,0.45), transparent 60%),
        radial-gradient(150% 130% at 50% 45%, #251b70 0%, #160f49 46%, #0b0830 100%);
      --surface: rgba(255,255,255,0.05);
      --hairline: rgba(255,255,255,0.3); --hairline-soft: rgba(255,255,255,0.14);
      --text: #ffffff; --text-secondary: rgba(233,230,255,0.85); --text-muted: rgba(255,255,255,0.52);
      --accent-hover: #b9a8ff;
      --chip-bg: #b9a8ff; --chip-fg: #0c0930;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: var(--font-sans);
      background-color: var(--bg); background-image: var(--bg-image);
      background-attachment: fixed;
      color: var(--text); line-height: 1.5; min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }
    a { color: inherit; text-decoration: none; }

    /* ===== 頂部導覽（全站統一 menubar）===== */
    .topnav {
      display: flex; align-items: center; justify-content: space-between;
      padding: 22px clamp(20px, 4vw, 56px) 16px;
      border-bottom: 1px solid var(--hairline);
      position: sticky; top: 0; z-index: 100;
      background: color-mix(in srgb, var(--bg) 92%, transparent);
      backdrop-filter: blur(10px);
    }
    .wordmark {
      font-family: var(--font-mono); font-weight: 700; font-size: 15px;
      letter-spacing: .14em; white-space: nowrap;
    }
    .wordmark b { opacity: .5; font-weight: 700; }
    .topnav-links {
      display: flex; align-items: center; gap: clamp(14px, 2.6vw, 36px);
      font-family: var(--font-mono); font-size: 11px; letter-spacing: .2em;
    }
    .topnav-links a {
      color: var(--text-secondary); padding-bottom: 3px;
      border-bottom: 1px solid transparent; transition: .2s; text-transform: uppercase;
    }
    .topnav-links a:hover, .topnav-links a.active { color: var(--text); border-bottom-color: var(--text); }
    /* dark mode toggle（軌道 + 圓鈕；dark 時鈕滑右）*/
    .mode-toggle {
      position: relative; width: 40px; height: 20px; flex-shrink: 0;
      border-radius: 999px; border: 1px solid var(--hairline);
      background: none; cursor: pointer; padding: 0; transition: .2s;
    }
    .mode-toggle::after {
      content: ""; position: absolute; top: 2px; left: 2px;
      width: 14px; height: 14px; border-radius: 50%;
      background: var(--text-secondary); transition: transform .25s, background .25s;
    }
    .mode-toggle:hover { border-color: var(--text); }
    [data-theme="dark"] .mode-toggle::after { transform: translateX(20px); background: var(--text); }

    /* 語言 dropdown（mono pill + chevron）*/
    .lang-select { position: relative; display: inline-flex; align-items: center; }
    .lang-select select {
      appearance: none; -webkit-appearance: none;
      font-family: var(--font-mono); font-size: 11px; letter-spacing: .1em;
      background: none; border: 1px solid var(--hairline); border-radius: 999px;
      color: var(--text-secondary); padding: 4px 26px 4px 12px;
      cursor: pointer; transition: .2s;
    }
    .lang-select select:hover { border-color: var(--text); color: var(--text); }
    .lang-select::after {
      content: "▾"; position: absolute; right: 10px; pointer-events: none;
      font-size: 10px; color: var(--text-muted);
    }
    .lang-select select option { color: #17140e; background: #fff; }

    /* ===== Hero ===== */
    .page-hero { text-align: center; padding: clamp(48px, 9vh, 110px) 20px clamp(28px, 5vh, 64px); }
    .hero-title {
      font-family: var(--font-mono); font-weight: 500;
      font-size: clamp(34px, 7vw, 84px); letter-spacing: .18em;
      text-transform: uppercase; line-height: 1.1;
    }
    .hero-sub {
      font-family: var(--font-mono); font-size: clamp(12px, 1.6vw, 15px);
      letter-spacing: .3em; color: var(--text-muted); margin-top: 18px;
    }

    /* ===== Content ===== */
    .content { max-width: 1280px; margin: 0 auto; padding: 0 clamp(20px, 4vw, 56px) 80px; }

    .quick-nav { display: flex; align-items: center; gap: 10px; margin-bottom: 28px; }
    .quick-nav input {
      border: 1px solid var(--hairline); background: var(--surface); color: var(--text);
      border-radius: 999px; padding: 6px 14px; font-size: 12px;
      font-family: var(--font-mono); outline: none; transition: border-color .2s;
    }
    .quick-nav input:focus { border-color: var(--text); }
    .quick-nav button {
      background: var(--chip-bg); color: var(--chip-fg); border: none;
      border-radius: 999px; padding: 7px 18px; font-size: 11px;
      font-family: var(--font-mono); letter-spacing: .1em; cursor: pointer; transition: opacity .2s;
    }
    .quick-nav button:hover { opacity: .85; }

    .date-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 16px;
    }
    .date-card {
      display: block; background: var(--surface);
      border: 1px solid var(--hairline); border-radius: 2px;
      padding: 20px; color: var(--text);
      transition: border-color .2s, transform .2s;
    }
    .date-card:hover { border-color: var(--text); transform: translateY(-2px); }
    .date-card.latest { border-left: 3px solid var(--chip-bg); }
    .date-card-date {
      font-family: var(--font-mono); font-size: 15px; font-weight: 700;
      letter-spacing: .08em;
    }
    .date-card-meta {
      font-size: 11px; color: var(--text-muted); font-family: var(--font-mono);
      letter-spacing: .06em; margin-top: 4px;
    }
    .date-card-highlight {
      font-size: 13px; color: var(--text-secondary); margin-top: 10px;
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
      overflow: hidden; line-height: 1.6;
    }

    @media (max-width: 768px) {
      .topnav { padding: 14px 16px 12px; }
      .topnav-links { gap: 12px; font-size: 10px; letter-spacing: .12em; }
      .wordmark { font-size: 13px; }
      .content { padding: 0 16px 48px; }
      .date-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <nav class="topnav">
    <a class="wordmark" href="./index.html">NO MORE <b>AI</b> FOMO</a>
    <div class="topnav-links">
      <a href="./index.html">HOME</a>
      <a class="active" href="./archive.html">ARCHIVE</a>
      <button class="mode-toggle" id="themeToggle" onclick="toggleTheme()"
        role="switch" aria-label="Dark mode"></button>
      <span class="lang-select"><select id="langSelect"
        onchange="setLang(this.value)" aria-label="Language">
        <option value="zh">中文</option>
        <option value="en">ENGLISH</option>
      </select></span>
    </div>
  </nav>

  <header class="page-hero">
    <h1 class="hero-title">Archive</h1>
    <div class="hero-sub" data-zh="歷史存檔" data-en="ALL PAST DIGESTS">歷史存檔</div>
  </header>

  <div class="content">
    <div class="quick-nav">
      <input type="date" id="dateInput">
      <button onclick="goToDate()" data-zh="跳轉" data-en="GO">跳轉</button>
    </div>
    <div class="date-grid">
      {{INDEX_ENTRIES}}
    </div>
  </div>

  <script>
    function goToDate() {
      var val = document.getElementById('dateInput').value;
      if (val) {
        window.location.href = './' + val + '.html';
      }
    }

    function toggleTheme() {
      var html = document.documentElement;
      var current = html.getAttribute('data-theme');
      var next = current === 'dark' ? 'light' : 'dark';
      html.setAttribute('data-theme', next);
      var t = document.getElementById('themeToggle');
      if (t) t.setAttribute('aria-checked', next === 'dark');
      try { localStorage.setItem('fomo-theme', next); } catch(e) {}
    }

    function setLang(lang) {
      document.documentElement.setAttribute('data-lang', lang);
      var els = document.querySelectorAll('[data-zh][data-en]');
      els.forEach(function(el) {
        el.textContent = el.getAttribute('data-' + lang);
      });
      var sel = document.getElementById('langSelect');
      if (sel) sel.value = lang;
      try { localStorage.setItem('fomo-lang', lang); } catch(e) {}
    }

    /* ===== Init（cream 為預設；只尊重手動切過嘅 theme）===== */
    (function() {
      var savedTheme, savedLang;
      try {
        savedTheme = localStorage.getItem('fomo-theme');
        savedLang = localStorage.getItem('fomo-lang');
      } catch(e) {}

      if (savedTheme) document.documentElement.setAttribute('data-theme', savedTheme);
      var t = document.getElementById('themeToggle');
      if (t) t.setAttribute('aria-checked',
        document.documentElement.getAttribute('data-theme') === 'dark');

      var defaultLang = document.documentElement.getAttribute('data-lang') || 'zh';
      setLang(savedLang || defaultLang);
    })();
  </script>
</body>
</html>
