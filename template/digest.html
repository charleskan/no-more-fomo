<!DOCTYPE html>
<html data-theme="light" data-lang="{{DIGEST_LANG}}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>No More AI FOMO — {{DIGEST_DATE}}</title>
  <style>
    /* ===== Design Tokens（Sequoia 米白為預設；dark = broadcast 紫）===== */
    :root,
    [data-theme="light"] {
      --bg: #f5f2ea;
      --bg-image: none;
      --surface: #fbf9f4;
      --hairline: #d9d2c2;
      --hairline-soft: #e6e0d2;
      --text: #17140e;
      --text-secondary: #4a4438;
      --text-muted: #8a8272;
      --accent: #17140e;
      --accent-hover: #6a4fe0;
      --chip-bg: #2e6b4f;
      --chip-fg: #f5f2ea;
      --font-sans: -apple-system, BlinkMacSystemFont, "PingFang TC", "Noto Sans TC", "Segoe UI", Roboto, sans-serif;
      --font-mono: "SF Mono", ui-monospace, Menlo, "Cascadia Code", monospace;
    }

    [data-theme="dark"] {
      --bg: #0c0930;
      --bg-image:
        radial-gradient(120% 95% at 82% 8%, rgba(96,74,236,0.50), transparent 55%),
        radial-gradient(110% 85% at 12% 88%, rgba(64,44,178,0.45), transparent 60%),
        radial-gradient(150% 130% at 50% 45%, #251b70 0%, #160f49 46%, #0b0830 100%);
      --surface: rgba(255,255,255,0.05);
      --hairline: rgba(255,255,255,0.3);
      --hairline-soft: rgba(255,255,255,0.14);
      --text: #ffffff;
      --text-secondary: rgba(233,230,255,0.85);
      --text-muted: rgba(255,255,255,0.52);
      --accent: #ffffff;
      --accent-hover: #b9a8ff;
      --chip-bg: #b9a8ff;
      --chip-fg: #0c0930;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--font-sans);
      background-color: var(--bg);
      background-image: var(--bg-image);
      background-attachment: fixed;
      color: var(--text);
      line-height: 1.6;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }
    a { color: inherit; text-decoration: none; }

    /* ===== 頂部導覽（mono 大寫 + 幼線）===== */
    .topnav {
      display: flex; align-items: center; justify-content: space-between;
      padding: 22px clamp(20px, 4vw, 56px) 16px;
      border-bottom: 1px solid var(--hairline);
      position: sticky; top: 0; z-index: 100;
      background: color-mix(in srgb, var(--bg) 92%, transparent);
      backdrop-filter: blur(10px);
    }
    .wordmark {
      font-family: var(--font-mono); font-weight: 700; font-size: 15px;
      letter-spacing: .14em; white-space: nowrap;
    }
    .wordmark b { opacity: .5; font-weight: 700; }
    .topnav-links {
      display: flex; align-items: center; gap: clamp(14px, 2.6vw, 36px);
      font-family: var(--font-mono); font-size: 11px; letter-spacing: .2em;
    }
    .topnav-links a {
      color: var(--text-secondary); padding-bottom: 3px;
      border-bottom: 1px solid transparent; transition: .2s; text-transform: uppercase;
    }
    .topnav-links a:hover, .topnav-links a.active { color: var(--text); border-bottom-color: var(--text); }
    /* dark mode toggle（軌道 + 圓鈕；dark 時鈕滑右）*/
    .mode-toggle {
      position: relative; width: 40px; height: 20px; flex-shrink: 0;
      border-radius: 999px; border: 1px solid var(--hairline);
      background: none; cursor: pointer; padding: 0; transition: .2s;
    }
    .mode-toggle::after {
      content: ""; position: absolute; top: 2px; left: 2px;
      width: 14px; height: 14px; border-radius: 50%;
      background: var(--text-secondary); transition: transform .25s, background .25s;
    }
    .mode-toggle:hover { border-color: var(--text); }
    [data-theme="dark"] .mode-toggle::after { transform: translateX(20px); background: var(--text); }

    /* 語言 dropdown（mono pill + chevron）*/
    .lang-select { position: relative; display: inline-flex; align-items: center; }
    .lang-select select {
      appearance: none; -webkit-appearance: none;
      font-family: var(--font-mono); font-size: 11px; letter-spacing: .1em;
      background: none; border: 1px solid var(--hairline); border-radius: 999px;
      color: var(--text-secondary); padding: 4px 26px 4px 12px;
      cursor: pointer; transition: .2s;
    }
    .lang-select select:hover { border-color: var(--text); color: var(--text); }
    .lang-select::after {
      content: "▾"; position: absolute; right: 10px; pointer-events: none;
      font-size: 10px; color: var(--text-muted);
    }
    .lang-select select option { color: #17140e; background: #fff; }

    /* ===== Hero：置中超大 mono 標題 ===== */
    .page-hero { text-align: center; padding: clamp(48px, 9vh, 110px) 20px clamp(28px, 5vh, 64px); }
    .hero-title {
      font-family: var(--font-mono); font-weight: 500;
      font-size: clamp(34px, 7vw, 84px); letter-spacing: .18em;
      text-transform: uppercase; line-height: 1.1; text-wrap: balance;
    }
    .hero-date {
      font-family: var(--font-mono); font-size: clamp(12px, 1.6vw, 15px);
      letter-spacing: .3em; color: var(--text-muted); margin-top: 18px;
    }

    /* ===== 日期 pills（Sequoia filter pill 式）===== */
    .date-nav {
      display: flex; align-items: center; justify-content: flex-start; gap: 8px;
      padding: 0 clamp(20px, 4vw, 56px) 22px;
      max-width: 1280px; margin: 0 auto;
      border-bottom: 1px solid var(--hairline);
    }
    .date-chips {
      display: flex; gap: 8px; overflow-x: auto;
      scrollbar-width: none; -ms-overflow-style: none;
    }
    .date-chips::-webkit-scrollbar { display: none; }
    .date-nav-btn, .date-chip {
      font-family: var(--font-mono); font-size: 11px; letter-spacing: .08em;
      color: var(--text-secondary); white-space: nowrap;
      border: 1px solid var(--hairline); border-radius: 999px;
      padding: 5px 14px; transition: .2s; flex-shrink: 0;
    }
    .date-nav-btn:hover:not(.disabled), .date-chip:hover { border-color: var(--text); color: var(--text); }
    .date-nav-btn.disabled { opacity: .3; cursor: default; }
    .date-chip.active { background: var(--chip-bg); color: var(--chip-fg); border-color: var(--chip-bg); }

    /* ===== Highlights（cream 塊 + hairline）===== */
    .highlights {
      max-width: 1280px; margin: 28px auto 8px;
      padding: 22px clamp(20px, 4vw, 56px) 26px;
    }
    .highlights-title {
      font-family: var(--font-mono); font-size: 12px; font-weight: 700;
      letter-spacing: .3em; text-transform: uppercase;
      color: var(--text-muted); margin-bottom: 14px;
    }
    .highlights ol { padding-left: 24px; font-size: 15px; line-height: 1.9; max-width: 880px; }
    .highlights li { margin-bottom: 8px; padding-left: 6px; }
    .highlights li::marker { font-family: var(--font-mono); color: var(--text-muted); }
    .highlights li a.hl-detail:hover { text-decoration: underline; text-underline-offset: 4px; }
    .highlights li a { font-size: 12px; font-family: var(--font-mono); color: var(--text-secondary); }

    /* ===== Sections → 兩欄大卡片 ===== */
    .content { max-width: 1280px; margin: 0 auto; padding: 8px clamp(20px, 4vw, 56px) 80px; }
    .content-wrap, .main-content, .sections-container { display: block; }
    .sidebar-nav { display: none; }

    .section {
      display: grid; grid-template-columns: 1fr 1fr;
      gap: 18px; margin-bottom: 56px;
    }
    .section-header {
      grid-column: 1 / -1;
      font-family: var(--font-mono); font-size: 13px; font-weight: 700;
      letter-spacing: .28em; text-transform: uppercase;
      color: var(--text); padding-bottom: 12px; margin-bottom: 4px;
      border-bottom: 1px solid var(--hairline);
      display: flex; align-items: center; gap: 10px;
    }
    .section-count {
      font-size: 10px; font-weight: 500; letter-spacing: .1em;
      border: 1px solid var(--hairline); border-radius: 999px;
      padding: 1px 9px; color: var(--text-muted);
    }

    /* —— 卡片：色塊 + 巨型 monogram + 白字（兩個 theme 都一樣）—— */
    .item {
      position: relative; overflow: hidden; border-radius: 2px;
      min-height: clamp(280px, 40vh, 440px);
      padding: clamp(18px, 2.5vw, 30px);
      display: flex; flex-direction: column; justify-content: flex-end;
      color: #fff;
      background: var(--card-bg, #14122c);
      border-bottom: none;
    }
    /* 色塊輪替（五款） */
    .section .item:nth-of-type(5n+2) { --card-bg: linear-gradient(160deg, #17114e, #0d0a33 70%); }
    .section .item:nth-of-type(5n+3) { --card-bg: #d8472b; }
    .section .item:nth-of-type(5n+4) { --card-bg: linear-gradient(165deg, #0d241c, #071a13 70%); }
    .section .item:nth-of-type(5n)   { --card-bg: linear-gradient(160deg, #241030, #150b28 70%); }
    .section .item:nth-of-type(5n+1) { --card-bg: linear-gradient(165deg, #0b2038, #091430 70%); }

    /* 巨型 monogram（section 決定字符，reddit「r/」手法） */
    .item::before {
      content: var(--glyph, "✦");
      position: absolute; top: 4%; right: 6%;
      font-family: var(--font-mono); font-weight: 700;
      font-size: clamp(120px, 16vw, 230px); line-height: 1;
      color: rgba(255,255,255,.14); pointer-events: none;
      letter-spacing: -.05em;
    }
    #highlights .item::before  { content: "★"; }
    #models .item::before      { content: "M"; }
    #tools .item::before       { content: "T/"; }
    #agents .item::before      { content: "Ag"; }
    #labs .item::before        { content: "Lb"; }
    #podcasts .item::before    { content: "▶"; }
    #hn .item::before          { content: "Y"; }
    #industry .item::before    { content: "In"; }
    #hf-papers .item::before   { content: "§"; }

    .item-title {
      font-weight: 700; font-size: clamp(19px, 2.3vw, 27px);
      line-height: 1.35; letter-spacing: .005em; margin-bottom: 8px;
      position: relative; z-index: 1; text-wrap: balance;
    }
    a.item-detail-title { color: #fff; }
    a.item-detail-title:hover { text-decoration: underline; text-underline-offset: 5px; text-decoration-thickness: 1px; }
    /* 成張卡可點（stretched link）；meta 細 link 疊喺上面 */
    a.item-detail-title::after { content: ""; position: absolute; inset: 0; z-index: 0; }
    .item-title a { position: static; }

    .item-desc {
      font-size: 14px; line-height: 1.7; color: rgba(255,255,255,.78);
      margin-bottom: 14px; position: relative; z-index: 1; max-width: 60ch;
      display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;
      pointer-events: none;   /* 俾 click 落到成張卡嘅 stretched link */
    }
    .item-meta {
      font-family: var(--font-mono); font-size: 11px;
      color: rgba(255,255,255,.6);
      display: flex; align-items: center; flex-wrap: wrap; gap: 8px;
      position: relative; z-index: 2;
    }
    .badge {
      display: inline-flex; align-items: center; font-size: 10px;
      padding: 2px 9px; border-radius: 999px; letter-spacing: .04em;
      border: 1px solid rgba(255,255,255,.35); color: rgba(255,255,255,.85);
    }
    .badge-green { border-color: rgba(140,255,200,.4); color: #9fe8c6; }
    .item-links a {
      color: rgba(255,255,255,.85); font-size: 11px;
      border-bottom: 1px solid rgba(255,255,255,.3); transition: .2s;
    }
    .item-links a:hover { border-bottom-color: #fff; color: #fff; }
    a.item-detail {
      font-family: var(--font-mono); font-size: 10px; white-space: nowrap;
      letter-spacing: .1em; color: #fff;
      border: 1px solid rgba(255,255,255,.4); border-radius: 999px; padding: 3px 11px;
      transition: .2s;
    }
    a.item-detail:hover { background: rgba(255,255,255,.18); border-color: #fff; }
    a.hl-detail { color: inherit; }

    .item-empty {
      grid-column: 1 / -1; min-height: 0;
      color: var(--text-muted); font-style: italic; font-size: 13px;
      background: none; padding: 8px 0;
    }
    .item-empty::before { content: none; }

    /* Podcast 摘要塊（卡入面） */
    .podcast-summary {
      background: rgba(0,0,0,.25); border-left: 2px solid rgba(255,255,255,.5);
      border-radius: 0 4px 4px 0; padding: 10px 14px; margin: 0 0 12px;
      position: relative; z-index: 1;
    }
    .tldr { font-weight: 500; font-size: 12.5px; line-height: 1.65; color: rgba(255,255,255,.85); }

    /* ===== Footer ===== */
    .footer {
      border-top: 1px solid var(--hairline);
      padding: 20px clamp(20px, 4vw, 56px) 40px;
      font-size: 11px; font-family: var(--font-mono);
      color: var(--text-muted); max-width: 1280px; margin: 0 auto;
      letter-spacing: .06em;
    }

    /* ===== Responsive ===== */
    @media (max-width: 860px) {
      .section { grid-template-columns: 1fr; }
      .item { min-height: clamp(220px, 32vh, 340px); }
      .topnav { padding: 14px 16px 12px; }
      .topnav-links { gap: 12px; font-size: 10px; letter-spacing: .12em; }
      .wordmark { font-size: 13px; }
      .highlights, .content, .date-nav { padding-left: 16px; padding-right: 16px; }
    }
  </style>
</head>
<body>
  <nav class="topnav">
    <a class="wordmark" href="./index.html">NO MORE <b>AI</b> FOMO</a>
    <div class="topnav-links">
      <a href="./index.html">HOME</a>
      <a href="./archive.html">ARCHIVE</a>
      <button class="mode-toggle" id="themeToggle" onclick="toggleTheme()"
        role="switch" aria-label="Dark mode"></button>
      <span class="lang-select"><select id="langSelect"
        onchange="switchLang(this.value)" aria-label="Language"></select></span>
    </div>
  </nav>

  <header class="page-hero">
    <h1 class="hero-title">Daily Digest</h1>
    <div class="hero-date">{{DIGEST_DATE}} · {{DIGEST_META}}</div>
  </header>

  <div class="date-nav">{{DIGEST_DATE_NAV}}</div>
  <div class="highlights">{{DIGEST_HIGHLIGHTS}}</div>
  <div class="content" id="mainContent">
    <div class="content-wrap">
      <nav class="sidebar-nav">{{DIGEST_SIDEBAR_NAV}}</nav>
      <div class="main-content">
        <div class="sections-container">{{DIGEST_SECTIONS}}</div>
      </div>
    </div>
  </div>
  <div class="footer">{{DIGEST_FOOTER}}</div>
  <script>
    function toggleTheme() {
      var html = document.documentElement;
      var next = html.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
      html.setAttribute('data-theme', next);
      var t = document.getElementById('themeToggle');
      if (t) t.setAttribute('aria-checked', next === 'dark');
      try { localStorage.setItem('fomo-theme', next); } catch(e) {}
    }

    var LOCALES = {{L10N_LOCALES}};
    var LANG_NAMES = { zh: '中文', en: 'ENGLISH' };

    /* Which locale does this basename end with? Returns {idx, stem}. */
    function splitLocale(base) {
      for (var i = 0; i < LOCALES.length; i++) {
        var suf = LOCALES[i].suffix;
        if (suf && base.length > suf.length && base.slice(-suf.length) === suf)
          return { idx: i, stem: base.slice(0, -suf.length) };
      }
      for (var j = 0; j < LOCALES.length; j++)
        if (LOCALES[j].suffix === '') return { idx: j, stem: base };
      return { idx: 0, stem: base };
    }

    /* Jump to the same page in the selected locale (detail pages keep --slug). */
    function switchLang(idx) {
      idx = +idx;
      var f = window.location.pathname.split('/').pop().replace(/\.html$/, '');
      var m = f.match(/^(.*?)--(.*)$/);
      var base = m ? m[1] : f;
      var rest = m ? '--' + m[2] : '';
      var cur = splitLocale(base);
      if (idx === cur.idx || !LOCALES[idx]) return;
      window.location.href = './' + cur.stem + LOCALES[idx].suffix + rest + '.html';
    }

    function setLang(lang) {
      document.documentElement.setAttribute('data-lang', lang);
      var els = document.querySelectorAll('[data-en]');
      els.forEach(function(el) {
        el.textContent = el.getAttribute('data-' + lang) || el.getAttribute('data-en');
      });
      try { localStorage.setItem('fomo-lang', lang); } catch(e) {}
    }

    /* ===== Init（米白為預設；只尊重手動切過嘅 theme）===== */
    (function() {
      var savedTheme, savedLang;
      try {
        savedTheme = localStorage.getItem('fomo-theme');
        savedLang = localStorage.getItem('fomo-lang');
      } catch(e) {}

      if (savedTheme) document.documentElement.setAttribute('data-theme', savedTheme);
      var t = document.getElementById('themeToggle');
      if (t) t.setAttribute('aria-checked',
        document.documentElement.getAttribute('data-theme') === 'dark');

      var defaultLang = document.documentElement.getAttribute('data-lang') || 'zh';
      setLang(savedLang || defaultLang);

      /* 語言 dropdown：現時 locale 預選 */
      var f = window.location.pathname.split('/').pop().replace(/\.html$/, '');
      var m = f.match(/^(.*?)--(.*)$/);
      var cur = splitLocale(m ? m[1] : f);
      var sel = document.getElementById('langSelect');
      if (sel) {
        sel.innerHTML = LOCALES.map(function(l, i) {
          var name = LANG_NAMES[l.code] || l.label || (l.code || '').toUpperCase();
          return '<option value="' + i + '"' + (i === cur.idx ? ' selected' : '') + '>' +
            name + '</option>';
        }).join('');
      }
    })();
  </script>
</body>
</html>
