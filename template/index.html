<!DOCTYPE html>
<html data-theme="dark" data-lang="zh">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>No More FOMO — Archive</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800;900&display=swap" rel="stylesheet">
  <style>
    /* ===== Design Tokens（broadcast 紫 = homepage 同款）===== */
    :root,
    [data-theme="light"] {
      --bg: #f4f2fc;
      --bg-image: none;
      --bg-secondary: #eae6f8;
      --surface: #ffffff;
      --surface-warm: #f8f6ff;
      --border: #d4ccec;
      --text: #191238;
      --text-secondary: #453a6e;
      --text-muted: #7d74a3;
      --accent: #6a4fe0;
      --accent-hover: #5238c0;
      --green: #0e7fa8;
      --yellow: #a67c00;
      --red: #c0392b;
      --radius: 6px;
      --font-sans: -apple-system, BlinkMacSystemFont, "PingFang TC", "Noto Sans TC", "Segoe UI", Roboto, sans-serif;
      --font-mono: "SF Mono", Menlo, "Cascadia Code", monospace;
      --font-display: 'Orbitron', "PingFang TC", "Noto Sans TC", sans-serif;
    }

    [data-theme="dark"] {
      --bg: #0c0930;
      --bg-image:
        radial-gradient(120% 95% at 82% 8%, rgba(96,74,236,0.50), transparent 55%),
        radial-gradient(110% 85% at 12% 88%, rgba(64,44,178,0.45), transparent 60%),
        radial-gradient(150% 130% at 50% 45%, #251b70 0%, #160f49 46%, #0b0830 100%);
      --bg-secondary: rgba(255,255,255,0.07);
      --surface: rgba(13,9,52,0.55);
      --surface-warm: rgba(255,255,255,0.06);
      --border: rgba(255,255,255,0.22);
      --text: #ffffff;
      --text-secondary: rgba(233,230,255,0.85);
      --text-muted: rgba(255,255,255,0.52);
      --accent: #b9a8ff;
      --accent-hover: #d9d0ff;
      --green: #4fd2ff;
      --yellow: #facc15;
      --red: #f87171;
      --radius: 10px;
    }

    /* ===== Reset & Base ===== */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: var(--font-sans);
      background-color: var(--bg);
      background-image: var(--bg-image);
      background-attachment: fixed;
      color: var(--text);
      line-height: 1.5;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    a {
      color: var(--accent);
      text-decoration: none;
    }

    a:hover {
      color: var(--accent-hover);
    }

    /* ===== Header ===== */
    .header {
      background: color-mix(in srgb, var(--bg) 88%, transparent);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      padding: 16px 24px;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .header-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      max-width: 1200px;
      margin: 0 auto;
      flex-wrap: wrap;
      gap: 12px;
    }

    a.title-link { color: inherit; display: inline-block; }
    a.title-link:hover .title span { color: var(--accent-hover); }

    .title {
      font-family: var(--font-display);
      font-size: 21px;
      font-weight: 900;
      letter-spacing: 0.04em;
    }

    .title span {
      color: var(--accent);
    }

    .meta {
      font-size: 12px;
      color: var(--text-muted);
      font-family: var(--font-mono);
      margin-top: 2px;
    }

    .controls {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* ===== Theme & Lang Buttons ===== */
    .theme-btn,
    .lang-btn {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 5px 10px;
      font-size: 12px;
      cursor: pointer;
      color: var(--text);
      font-family: var(--font-sans);
      transition: all 0.15s ease;
    }

    .theme-btn:hover,
    .lang-btn:hover {
      background: var(--bg-secondary);
    }

    /* ===== Content Layout ===== */
    .content {
      max-width: 1200px;
      margin: 0 auto;
      padding: 24px 24px 40px;
    }

    /* ===== Quick Nav ===== */
    .quick-nav {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 20px;
    }

    .quick-nav input {
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      border-radius: var(--radius);
      padding: 6px 10px;
      font-size: 13px;
      font-family: var(--font-sans);
      outline: none;
      transition: border-color 0.15s ease;
    }

    .quick-nav input:focus {
      border-color: var(--accent);
    }

    .quick-nav button {
      background: var(--accent);
      color: #ffffff;
      border: none;
      border-radius: var(--radius);
      padding: 6px 14px;
      font-size: 13px;
      font-family: var(--font-sans);
      cursor: pointer;
      transition: background 0.15s ease;
    }

    .quick-nav button:hover {
      background: var(--accent-hover);
    }

    /* ===== Date Grid ===== */
    .date-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 12px;
    }

    /* ===== Date Card ===== */
    .date-card {
      display: block;
      text-decoration: none;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px;
      color: var(--text);
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }

    .date-card:hover {
      border-color: var(--accent);
      color: var(--text);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
    }

    .date-card.latest {
      border-left: 3px solid var(--accent);
    }

    .date-card-date {
      font-family: var(--font-display);
      font-size: 15px;
      font-weight: 800;
      letter-spacing: 0.05em;
      color: var(--text);
    }

    .date-card-meta {
      font-size: 11px;
      color: var(--text-muted);
      font-family: var(--font-mono);
      margin-top: 3px;
    }

    .date-card-highlight {
      font-size: 12px;
      color: var(--text-secondary);
      margin-top: 6px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      line-height: 1.5;
    }

    /* ===== Responsive ===== */
    @media (max-width: 768px) {
      .header {
        padding: 12px 16px;
      }

      .header-top {
        flex-direction: column;
        align-items: flex-start;
      }

      .content {
        padding: 16px 16px 32px;
      }

      .date-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="header-top">
      <div>
        <a href="./index.html" class="title-link"><div class="title">No More <span>FOMO</span></div></a>
        <div class="meta" data-zh="歷史存檔" data-en="Archive">歷史存檔</div>
      </div>
      <div class="controls">
        <button class="theme-btn" onclick="toggleTheme()">🌓</button>
        <button class="lang-btn" onclick="toggleLang()">中/EN</button>
      </div>
    </div>
  </div>

  <div class="content">
    <div class="quick-nav">
      <input type="date" id="dateInput">
      <button onclick="goToDate()" data-zh="跳轉" data-en="Go">跳轉</button>
    </div>
    <div class="date-grid">
      {{INDEX_ENTRIES}}
    </div>
  </div>

  <script>
    function goToDate() {
      var val = document.getElementById('dateInput').value;
      if (val) {
        window.location.href = './' + val + '.html';
      }
    }

    function toggleTheme() {
      var html = document.documentElement;
      var current = html.getAttribute('data-theme');
      var next = current === 'dark' ? 'light' : 'dark';
      html.setAttribute('data-theme', next);
      try { localStorage.setItem('fomo-theme', next); } catch(e) {}
    }

    function toggleLang() {
      var html = document.documentElement;
      var current = html.getAttribute('data-lang');
      var next = current === 'zh' ? 'en' : 'zh';
      setLang(next);
    }

    function setLang(lang) {
      document.documentElement.setAttribute('data-lang', lang);
      var els = document.querySelectorAll('[data-zh][data-en]');
      els.forEach(function(el) {
        el.textContent = el.getAttribute('data-' + lang);
      });
      try { localStorage.setItem('fomo-lang', lang); } catch(e) {}
    }

    /* ===== Init ===== */
    (function() {
      var savedTheme, savedLang;
      try {
        savedTheme = localStorage.getItem('fomo-theme');
        savedLang = localStorage.getItem('fomo-lang');
      } catch(e) {}

      if (savedTheme) {
        document.documentElement.setAttribute('data-theme', savedTheme);
      } else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
        document.documentElement.setAttribute('data-theme', 'dark');
      }

      var defaultLang = document.documentElement.getAttribute('data-lang') || 'zh';
      var lang = savedLang || defaultLang;
      setLang(lang);
    })();
  </script>
</body>
</html>
