<!DOCTYPE html>
<html data-theme="dark" data-lang="{{DIGEST_LANG}}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>No More FOMO — {{DIGEST_DATE}}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800;900&display=swap" rel="stylesheet">
  <style>
    /* ===== Design Tokens（broadcast 紫 = homepage 同款）===== */
    :root,
    [data-theme="light"] {
      --bg: #f4f2fc;
      --bg-image: none;
      --bg-secondary: #eae6f8;
      --surface: #ffffff;
      --surface-warm: #f8f6ff;
      --surface-elevated: #ffffff;
      --border: #d4ccec;
      --border-subtle: #e4def4;
      --text: #191238;
      --text-secondary: #453a6e;
      --text-muted: #7d74a3;
      --accent: #6a4fe0;
      --accent-hover: #5238c0;
      --accent-subtle: rgba(106, 79, 224, 0.09);
      --green: #0e7fa8;
      --green-subtle: rgba(14, 127, 168, 0.09);
      --shadow-sm: 0 1px 2px rgba(25, 18, 56, 0.05);
      --shadow-md: 0 2px 8px rgba(25, 18, 56, 0.08), 0 1px 2px rgba(25, 18, 56, 0.05);
      --radius: 8px;
      --radius-sm: 5px;
      --font-sans: -apple-system, BlinkMacSystemFont, "PingFang TC", "Noto Sans TC", "Segoe UI", Roboto, sans-serif;
      --font-mono: "SF Mono", Menlo, "Cascadia Code", "Fira Code", monospace;
      --font-display: 'Orbitron', "PingFang TC", "Noto Sans TC", sans-serif;
    }

    [data-theme="dark"] {
      --bg: #0c0930;
      --bg-image:
        radial-gradient(120% 95% at 82% 8%, rgba(96, 74, 236, 0.50), transparent 55%),
        radial-gradient(110% 85% at 12% 88%, rgba(64, 44, 178, 0.45), transparent 60%),
        radial-gradient(150% 130% at 50% 45%, #251b70 0%, #160f49 46%, #0b0830 100%);
      --bg-secondary: rgba(255, 255, 255, 0.07);
      --surface: #171058;
      --surface-warm: rgba(255, 255, 255, 0.06);
      --surface-elevated: #1d1668;
      --border: rgba(255, 255, 255, 0.28);
      --border-subtle: rgba(255, 255, 255, 0.13);
      --text: #ffffff;
      --text-secondary: rgba(233, 230, 255, 0.85);
      --text-muted: rgba(255, 255, 255, 0.52);
      --accent: #b9a8ff;
      --accent-hover: #d9d0ff;
      --accent-subtle: rgba(150, 128, 255, 0.16);
      --green: #4fd2ff;
      --green-subtle: rgba(79, 210, 255, 0.13);
      --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.35);
      --shadow-md: 0 4px 16px rgba(0, 0, 0, 0.45);
      --radius: 10px;
      --radius-sm: 6px;
    }

    /* ===== Reset & Base ===== */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: var(--font-sans);
      background-color: var(--bg);
      background-image: var(--bg-image);
      background-attachment: fixed;
      color: var(--text);
      line-height: 1.6;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    a {
      color: var(--accent);
      text-decoration: none;
      transition: color 0.15s ease;
    }

    a:hover {
      color: var(--accent-hover);
    }

    /* Per-item detail links */
    a.item-detail-title { color: inherit; }
    a.item-detail-title:hover { color: var(--accent); }
    a.item-detail {
      font-family: var(--font-mono); font-size: 11px; white-space: nowrap;
      color: var(--accent); background: var(--accent-subtle);
      border: 1px solid var(--border); border-radius: 999px; padding: 1px 9px;
      transition: all 0.15s ease;
    }
    a.item-detail:hover { background: var(--accent); color: var(--surface); border-color: var(--accent); }
    a.hl-detail { color: inherit; }
    a.hl-detail:hover { color: var(--accent); }
    .highlights li a.hl-detail { cursor: pointer; }

    /* ===== Header ===== */
    .header {
      border-bottom: 1px solid var(--border);
      padding: 14px 24px;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: var(--shadow-sm);
      backdrop-filter: blur(12px);
      background: color-mix(in srgb, var(--surface) 92%, transparent);
    }

    @media (prefers-reduced-motion: reduce) {
      .header {
        backdrop-filter: none;
        background: var(--surface);
      }
    }

    .header-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      max-width: 880px;
      margin: 0 auto;
      flex-wrap: wrap;
      gap: 12px;
    }

    .back-link {
      display: inline-block;
      font-size: 11px;
      color: var(--text-muted);
      text-decoration: none;
      font-family: var(--font-mono);
      letter-spacing: 0.02em;
      margin-bottom: 2px;
      transition: color 0.15s ease;
    }

    .back-link:hover {
      color: var(--accent);
    }

    a.title-link { color: inherit; display: inline-block; }
    a.title-link:hover .title span { color: var(--accent-hover); }

    .title {
      font-family: var(--font-display);
      font-size: 19px;
      font-weight: 900;
      letter-spacing: 0.04em;
      line-height: 1.2;
    }

    .title span {
      color: var(--accent);
    }

    .meta {
      font-size: 11px;
      color: var(--text-muted);
      font-family: var(--font-mono);
      margin-top: 1px;
      letter-spacing: 0.02em;
    }

    .controls {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* ===== View Switcher ===== */
    .view-switcher {
      display: flex;
      background: var(--bg-secondary);
      border-radius: var(--radius-sm);
      padding: 2px;
      gap: 1px;
    }

    .view-btn {
      background: none;
      border: none;
      padding: 5px 12px;
      font-size: 11px;
      font-family: var(--font-sans);
      color: var(--text-muted);
      cursor: pointer;
      border-radius: calc(var(--radius-sm) - 2px);
      transition: all 0.2s ease;
      font-weight: 500;
    }

    .view-btn.active {
      background: var(--surface-elevated);
      color: var(--text);
      box-shadow: var(--shadow-sm);
      font-weight: 600;
    }

    .view-btn:hover:not(.active) {
      color: var(--text-secondary);
    }

    /* ===== Theme & Lang Buttons ===== */
    .theme-btn,
    .lang-btn {
      background: var(--surface);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-sm);
      padding: 5px 10px;
      font-size: 11px;
      cursor: pointer;
      color: var(--text-muted);
      font-family: var(--font-sans);
      font-weight: 500;
      transition: all 0.2s ease;
    }

    .theme-btn:hover,
    .lang-btn:hover {
      background: var(--bg-secondary);
      color: var(--text-secondary);
      border-color: var(--border);
    }

    /* ===== Date Nav ===== */
    .date-nav {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 10px 24px;
      max-width: 880px;
      margin: 0 auto;
    }

    .date-nav-btn,
    .date-chip {
      font-size: 11px;
      font-family: var(--font-mono);
      color: var(--text-muted);
      text-decoration: none;
      padding: 4px 10px;
      transition: all 0.15s ease;
      white-space: nowrap;
    }

    .date-nav-btn:hover:not(.disabled),
    .date-chip:hover {
      background: var(--accent-subtle);
      color: var(--accent);
    }

    .date-nav-btn {
      border-radius: var(--radius-sm);
      flex-shrink: 0;
    }

    .date-nav-btn.disabled {
      opacity: 0.3;
      cursor: default;
    }

    .date-chips {
      display: flex;
      gap: 4px;
      overflow-x: auto;
      scrollbar-width: none;
      -ms-overflow-style: none;
      flex: 1;
      justify-content: center;
    }

    .date-chips::-webkit-scrollbar { display: none; }

    .date-chip {
      border-radius: 99px;
    }

    .date-chip.active {
      background: var(--accent);
      color: #fff;
      font-weight: 600;
    }

    [data-theme="dark"] .date-chip.active {
      color: var(--bg);
    }

    /* ===== Highlights ===== */
    .highlights {
      background: var(--surface);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius);
      margin: 20px auto;
      padding: 18px 22px;
      max-width: 880px;
      box-shadow: var(--shadow-sm);
    }

    .highlights-title {
      font-family: var(--font-display);
      color: var(--accent);
      text-transform: uppercase;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.3em;
      margin-bottom: 10px;
      opacity: 0.9;
    }

    .highlights ol {
      padding-left: 22px;
      font-size: 13px;
      line-height: 1.75;
    }

    .highlights li {
      margin-bottom: 6px;
      padding-left: 4px;
    }

    .highlights li::marker {
      color: var(--accent);
      font-weight: 700;
    }

    .highlights li b {
      color: var(--text);
    }

    .highlights li a {
      font-size: 11px;
      font-family: var(--font-mono);
    }

    /* ===== Content Layout ===== */
    .content {
      max-width: 880px;
      margin: 0 auto;
      padding: 0 24px 60px;
    }

    .content-wrap {
      display: block;
    }

    .main-content {
      min-width: 0;
    }

    .sections-container {
      display: block;
    }

    /* ===== Sidebar Nav ===== */
    .sidebar-nav {
      display: none;
    }

    .sidebar-nav a {
      display: block;
      padding: 5px 10px;
      font-size: 12px;
      color: var(--text-muted);
      border-radius: var(--radius-sm);
      transition: all 0.15s ease;
      font-weight: 450;
    }

    .sidebar-nav a:hover {
      background: var(--accent-subtle);
      color: var(--accent);
    }

    .sidebar-nav a.active {
      color: var(--accent);
      font-weight: 600;
      background: var(--accent-subtle);
    }

    /* ===== Section ===== */
    .section {
      margin-bottom: 32px;
    }

    .section-header {
      font-family: var(--font-display);
      color: var(--text);
      font-size: 14px;
      font-weight: 800;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--border-subtle);
      margin-bottom: 2px;
      display: flex;
      align-items: center;
      gap: 8px;
      letter-spacing: 0.08em;
    }

    /* broadcast 式小菱形（同 homepage .g-ico 一款） */
    .section-header::before {
      content: '';
      width: 0.75em;
      height: 0.75em;
      flex-shrink: 0;
      background: var(--accent);
      clip-path: polygon(0 0, 100% 0, 74% 100%, 0 74%);
    }

    .section-count {
      background: var(--accent-subtle);
      font-size: 10px;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 99px;
      color: var(--accent);
      letter-spacing: 0.02em;
    }

    /* ===== Item ===== */
    .item {
      padding: 12px 0 14px;
      border-bottom: 1px solid var(--border-subtle);
    }

    .item:last-child {
      border-bottom: none;
    }

    .item-title {
      font-weight: 650;
      font-size: 14px;
      line-height: 1.4;
      letter-spacing: -0.01em;
    }

    .item-desc {
      font-size: 13px;
      color: var(--text-secondary);
      margin-top: 4px;
      line-height: 1.65;
    }

    .item-meta {
      font-size: 11px;
      font-family: var(--font-mono);
      color: var(--text-muted);
      margin-top: 8px;
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 6px;
    }

    .item-links a {
      color: var(--accent);
      text-decoration: none;
      font-size: 11px;
      font-weight: 500;
      padding: 1px 0;
      border-bottom: 1px solid transparent;
      transition: border-color 0.15s ease;
    }

    .item-links a:hover {
      color: var(--accent-hover);
      border-bottom-color: var(--accent-hover);
    }

    /* ===== Item Empty ===== */
    .item-empty {
      color: var(--text-muted);
      font-style: italic;
      font-size: 12px;
      padding: 12px 0;
    }

    /* ===== Badge ===== */
    .badge {
      display: inline-flex;
      align-items: center;
      font-size: 10px;
      padding: 2px 8px;
      border-radius: 99px;
      font-weight: 550;
      letter-spacing: 0.02em;
    }

    .badge-source {
      background: var(--accent-subtle);
      color: var(--accent);
    }

    .badge-green {
      background: var(--green-subtle);
      color: var(--green);
    }

    /* ===== Podcast ===== */
    .podcast-summary {
      background: var(--surface-warm);
      border-left: 2px solid var(--accent);
      border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
      padding: 10px 14px;
      margin-top: 8px;
    }

    .tldr {
      font-weight: 600;
      font-size: 12px;
      line-height: 1.6;
      color: var(--text-secondary);
    }


    /* ===== Footer ===== */
    .footer {
      border-top: 1px solid var(--border-subtle);
      padding: 16px 24px;
      font-size: 11px;
      font-family: var(--font-mono);
      color: var(--text-muted);
      max-width: 880px;
      margin: 0 auto;
      letter-spacing: 0.02em;
    }

    /* ===== View: Newspaper (default) ===== */
    .view-newspaper .sidebar-nav {
      display: none;
    }

    /* ===== View: Sidebar ===== */
    .view-sidebar .content-wrap {
      display: flex;
      gap: 24px;
    }

    .view-sidebar .sidebar-nav {
      display: block;
      width: 170px;
      flex-shrink: 0;
      position: sticky;
      top: 80px;
      align-self: flex-start;
      padding-top: 8px;
    }

    /* ===== View: Grid ===== */
    .view-grid .sidebar-nav {
      display: none;
    }

    .view-grid .sections-container {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }

    .view-grid .section {
      background: var(--surface);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius);
      padding: 14px 16px;
      margin-bottom: 0;
      box-shadow: var(--shadow-sm);
      transition: box-shadow 0.2s ease;
    }

    .view-grid .section:hover {
      box-shadow: var(--shadow-md);
    }

    .view-grid .section.wide {
      grid-column: 1 / -1;
    }

    .view-grid .item-desc {
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    /* ===== Responsive ===== */
    @media (max-width: 768px) {
      .header {
        padding: 12px 16px;
      }

      .header-top {
        flex-direction: column;
        align-items: flex-start;
      }

      .highlights {
        margin: 12px 16px;
      }

      .content {
        padding: 0 16px 24px;
      }

      .view-grid .sections-container {
        grid-template-columns: 1fr;
      }

      .view-sidebar .content-wrap {
        flex-direction: column;
      }

      .view-sidebar .sidebar-nav {
        width: 100%;
        position: static;
      }
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="header-top">
      <div>
        <a href="./archive.html" class="back-link" {{L10N_ATTRS:archive}}>{{L10N:archive}}</a>
        <a href="./index.html" class="title-link"><div class="title">No More <span>FOMO</span></div></a>
        <div class="meta">{{DIGEST_DATE}} | {{DIGEST_META}}</div>
      </div>
      <div class="controls">
        <div class="view-switcher">
          <button class="view-btn active" {{L10N_ATTRS:viewNewspaper}} onclick="setView('newspaper')">{{L10N:viewNewspaper}}</button>
          <button class="view-btn" {{L10N_ATTRS:viewSidebar}} onclick="setView('sidebar')">{{L10N:viewSidebar}}</button>
          <button class="view-btn" {{L10N_ATTRS:viewGrid}} onclick="setView('grid')">{{L10N:viewGrid}}</button>
        </div>
        <button class="theme-btn" onclick="toggleTheme()">🌓</button>
        <button class="lang-btn" onclick="toggleLang()">{{L10N_LANG_TOGGLE}}</button>
      </div>
    </div>
  </div>
  <div class="date-nav">{{DIGEST_DATE_NAV}}</div>
  <div class="highlights">{{DIGEST_HIGHLIGHTS}}</div>
  <div class="content view-newspaper" id="mainContent">
    <div class="content-wrap">
      <nav class="sidebar-nav">{{DIGEST_SIDEBAR_NAV}}</nav>
      <div class="main-content">
        <div class="sections-container">{{DIGEST_SECTIONS}}</div>
      </div>
    </div>
  </div>
  <div class="footer">{{DIGEST_FOOTER}}</div>
  <script>
    function setView(view) {
      var el = document.getElementById('mainContent');
      el.className = 'content view-' + view;
      var btns = document.querySelectorAll('.view-btn');
      btns.forEach(function(btn) {
        var btnView = btn.getAttribute('onclick').match(/'(\w+)'/)[1];
        if (btnView === view) {
          btn.classList.add('active');
        } else {
          btn.classList.remove('active');
        }
      });
      try { localStorage.setItem('fomo-view', view); } catch(e) {}
    }

    function toggleTheme() {
      var html = document.documentElement;
      var current = html.getAttribute('data-theme');
      var next = current === 'dark' ? 'light' : 'dark';
      html.setAttribute('data-theme', next);
      try { localStorage.setItem('fomo-theme', next); } catch(e) {}
    }

    var LOCALES = {{L10N_LOCALES}};

    /* Which locale does this basename end with? Returns {idx, stem}. */
    function splitLocale(base) {
      for (var i = 0; i < LOCALES.length; i++) {
        var suf = LOCALES[i].suffix;
        if (suf && base.length > suf.length && base.slice(-suf.length) === suf)
          return { idx: i, stem: base.slice(0, -suf.length) };
      }
      for (var j = 0; j < LOCALES.length; j++)
        if (LOCALES[j].suffix === '') return { idx: j, stem: base };
      return { idx: 0, stem: base };
    }

    /* Cycle to the same page in the next locale (detail pages keep --slug). */
    function toggleLang() {
      var f = window.location.pathname.split('/').pop().replace(/\.html$/, '');
      var m = f.match(/^(.*?)--(.*)$/);
      var base = m ? m[1] : f;
      var rest = m ? '--' + m[2] : '';
      var cur = splitLocale(base);
      var next = LOCALES[(cur.idx + 1) % LOCALES.length];
      window.location.href = './' + cur.stem + next.suffix + rest + '.html';
    }

    function setLang(lang) {
      document.documentElement.setAttribute('data-lang', lang);
      var els = document.querySelectorAll('[data-en]');
      els.forEach(function(el) {
        el.textContent = el.getAttribute('data-' + lang) || el.getAttribute('data-en');
      });
      try { localStorage.setItem('fomo-lang', lang); } catch(e) {}
    }

    /* ===== Init ===== */
    (function() {
      var savedView, savedTheme, savedLang;
      try {
        savedView = localStorage.getItem('fomo-view');
        savedTheme = localStorage.getItem('fomo-theme');
        savedLang = localStorage.getItem('fomo-lang');
      } catch(e) {}

      if (savedView) {
        setView(savedView);
      }

      if (savedTheme) {
        document.documentElement.setAttribute('data-theme', savedTheme);
      } else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
        document.documentElement.setAttribute('data-theme', 'dark');
      }

      var defaultLang = document.documentElement.getAttribute('data-lang') || 'zh';
      var lang = savedLang || defaultLang;
      setLang(lang);
    })();
  </script>
</body>
</html>
